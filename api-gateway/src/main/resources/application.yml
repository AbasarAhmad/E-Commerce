server:
  port: 8585

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      routes:
        - id: product-service
          uri: http://localhost:8181
          predicates:
            - Path=/api/v1/products/**

        - id: auth-service
          uri: http://localhost:8182
          predicates:
            - Path=/api/v1/auth/**