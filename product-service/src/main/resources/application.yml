server:
  port: 8181

spring:
  application:
    name: product-service
  datasource:
    url: jdbc:mysql://localhost:3306/ecommerce
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

logging:
  level:
    root: INFO
    com.ecommerce.product: INFO
    org.springframework.security: INFO
jwt:
   secret: ${JWT_SECRET:my-super-secret-key-for-ecommerce-auth-service-123456}
   expiration: 3600000

eureka:
  client:
    service-url:
     defaultZone: http://localhost:8761/eureka/

